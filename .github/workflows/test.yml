name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mise.toml
          cache: npm
      - run: npm ci
      - id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-browsers-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # System libraries live outside the cached path, so they're installed on every run
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-browsers-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.playwright-browsers-cache.outputs.cache-hit == 'true'
      - run: npm test
      # On failure, keep Playwright's traces (recorded on the first retry) for debugging with
      # `npx playwright show-trace`
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
